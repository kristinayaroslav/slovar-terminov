<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифровой словарь</title>
<style>
  :root {
    --bg: #f3ead9;
    --card: #fffaf0;
    --ink: #362f28;
    --muted: #7a6f60;
    --accent: #4a7185;
    --accent-soft: #dcebf1;
    --note: #f0c9d6;
    --note-ink: #6b3b33;
    --border: #d9ccb4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a2620;
      --card: #363129;
      --ink: #f3ead9;
      --muted: #b9ae9b;
      --accent: #9cc3d5;
      --accent-soft: #33454e;
      --note: #4a3540;
      --note-ink: #f0d3dc;
      --border: #4a4338;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a2620;
    --card: #363129;
    --ink: #f3ead9;
    --muted: #b9ae9b;
    --accent: #9cc3d5;
    --accent-soft: #33454e;
    --note: #4a3540;
    --note-ink: #f0d3dc;
    --border: #4a4338;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 20px;
    line-height: 1.5;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 34px;
    line-height: 1.15;
    font-weight: 700;
  }
  .lead {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 19px;
  }
  .search {
    width: 100%;
    font-family: inherit;
    font-size: 21px;
    padding: 16px 18px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--ink);
    margin-bottom: 18px;
  }
  .search:focus { outline: 3px solid var(--accent); border-color: var(--accent); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab {
    font-family: inherit;
    font-size: 17px;
    padding: 9px 15px;
    border-radius: 999px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { margin: 0 0 14px; color: var(--muted); font-size: 16px; }
  details {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  details[open] { border-color: var(--accent); }
  summary {
    list-style: none;
    cursor: pointer;
    padding: 18px 20px;
    font-size: 24px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "+";
    font-size: 30px;
    color: var(--accent);
    line-height: 1;
  }
  details[open] summary::after { content: "–"; }
  .body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; }
  .body p { margin: 0; }
  .label {
    display: block;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .example {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .capcut {
    border: 2px dashed var(--accent);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .tip {
    background: var(--note);
    color: var(--note-ink);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .empty { color: var(--muted); font-size: 19px; padding: 10px 2px; }
  .sticky-bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding-top: 8px;
    margin: 0 -18px;
    padding-left: 18px;
    padding-right: 18px;
    z-index: 5;
  }
  .tab .n { opacity: .7; font-size: 14px; }
  .cat-heading {
    font-family: Georgia, serif;
    font-size: 17px;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin: 22px 2px 10px;
  }
  .cat-heading:first-child { margin-top: 4px; }
  .totop {
    position: fixed;
    right: 18px;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: 52px;
    height: 52px;
    border-radius: 26px;
    border: 2px solid var(--border);
    background: var(--accent);
    color: #fff;
    font-size: 22px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .totop.show { display: flex; }
  mark {
    background: var(--note);
    color: var(--note-ink);
    border-radius: 4px;
    padding: 0 2px;
  }


</style>
</head>
<body>
<main>
  <p class="eyebrow">🔤 Цифровой словарь</p>
  <h1>Словарик: слова из мира телефона</h1>
  <p class="lead">Нажмите на слово — увидите, что оно значит, простыми словами.</p>

  <div class="sticky-bar">
    <input id="q" class="search" type="search" placeholder="Найти слово…" autocomplete="off" aria-label="Поиск по словарю">
    <div id="tabs" class="tabs" role="group" aria-label="Разделы словаря"></div>
    <p id="count" class="count"></p>
  </div>
  <div id="list"></div>
</main>
<button id="totop" class="totop" type="button" aria-label="Наверх">↑</button>

    "Промпт": "rgba(200,140,40,.13)",
    "Видеомонтаж": "rgba(180,60,140,.13)",
    "CapCut": "rgba(50,140,170,.13)"
  };
  var CAT_ICONS = {
    "Телефон": "📱", "Интернет": "🌐", "Чаты": "💬", "Защита": "🔒", "VPN": "🛡️",
    "Платежи": "💳", "Сленг": "✨", "Нейросети": "🤖", "Промпт": "💭",
    "Видеомонтаж": "🎬", "CapCut": "✂️"
  };
  var CAT_NAMES = ["Все", "Телефон", "Интернет", "Чаты", "Защита", "VPN", "Платежи", "Сленг", "Нейросети", "Промпт", "Видеомонтаж", "CapCut"];
  var current = "Все";

  TERMS.sort(function (a, b) { return a.w.localeCompare(b.w, "ru"); });

  var listEl = document.getElementById("list");
  var tabsEl = document.getElementById("tabs");
  var countEl = document.getElementById("count");
  var qEl = document.getElementById("q");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function escRe(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function hl(s, q) {
    var safe = esc(s);
    if (!q) return safe;
    var re = new RegExp("(" + escRe(esc(q)) + ")", "ig");
    return safe.replace(re, "<mark>$1</mark>");
  }

  function cardHtml(t, q, color) {
    var open = q ? " open" : "";
    var style = color ? ' style="background:' + color + '"' : "";
    var html = '<details' + open + style + '><summary>' + hl(t.w, q) + '</summary><div class="body">';
    html += '<p><span class="label">Простыми словами</span>' + hl(t.d, q) + '</p>';
    if (t.e) html += '<p class="example"><span class="label">Пример</span>' + hl(t.e, q) + '</p>';
    if (t.g) html += '<p class="capcut"><span class="label">В CapCut</span>' + hl(t.g, q) + '</p>';
    if (t.t) html += '<p class="tip"><span class="label">Запомните</span>' + hl(t.t, q) + '</p>';
    html += '</div></details>';
    return html;
  }

  function render(filter) {
    var f = (filter || "").trim().toLowerCase();
    var items = TERMS.filter(function (t) {
      if (current !== "Все" && CATS[current].indexOf(t.w) === -1) return false;
      if (!f) return true;
      return (t.w + " " + t.d + " " + (t.e || "") + " " + (t.g || "")).toLowerCase().indexOf(f) !== -1;
    });
    countEl.textContent = (f || current !== "Все") ? "Найдено: " + items.length : "Слов в словарике: " + TERMS.length;
    if (current === "CapCut") countEl.textContent += ". Названия кнопок могут чуть отличаться в вашей версии CapCut.";
    if (items.length === 0) {
      listEl.innerHTML = '<p class="empty">Такого слова пока нет. Спросите на занятии — добавим.</p>';
      return;
    }
    if (current !== "Все") {
      var tabColor = CAT_COLORS[current];
      listEl.innerHTML = items.map(function (t) { return cardHtml(t, f, current === "Все" ? null : tabColor); }).join("");
      return;
    }
    var byCat = Object.keys(CATS).map(function (name) {
      var inCat = items.filter(function (t) { return CATS[name].indexOf(t.w) !== -1; });
      return { name: name, items: inCat };
    }).filter(function (g) { return g.items.length > 0; });
    listEl.innerHTML = byCat.map(function (g) {
      var head = '<p class="cat-heading">' + (CAT_ICONS[g.name] || "") + " " + esc(g.name) + '</p>';
      var gColor = CAT_COLORS[g.name];
      return head + g.items.map(function (t) { return cardHtml(t, f, gColor); }).join("");
    }).join("");
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    CAT_NAMES.forEach(function (name) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab";
      var n = name === "Все" ? TERMS.length : CATS[name].length;
      var icon = CAT_ICONS[name] ? CAT_ICONS[name] + " " : "";
      b.innerHTML = icon + esc(name) + ' <span class="n">' + n + '</span>';
      var isActive = name === current;
      b.setAttribute("aria-pressed", isActive ? "true" : "false");
      if (!isActive && name !== "Все" && CAT_COLORS[name]) {
        b.style.background = CAT_COLORS[name];
        b.style.borderColor = "transparent";
      }
      b.addEventListener("click", function () {
        current = name;
        renderTabs();
        render(qEl.value);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      tabsEl.appendChild(b);
    });
  }

  qEl.addEventListener("input", function () { render(qEl.value); });

  var totopBtn = document.getElementById("totop");
  totopBtn.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  window.addEventListener("scroll", function () {
    totopBtn.classList.toggle("show", window.scrollY > 400);
  });

  renderTabs();
  render("");
})();
</script>
</body>
</html>
